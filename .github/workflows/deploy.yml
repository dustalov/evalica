name: Deploy

on:
  release:
    types: [ "published" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DO_NOT_TRACK: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

permissions:
  contents: read

# Heavily inspired by https://github.com/pydantic/pydantic-core/blob/main/.github/workflows/ci.yml
jobs:
  rust:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: cargo publish --locked --dry-run
    - if: github.event_name == 'release'
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      id: auth
    - if: github.event_name == 'release'
      run: cargo publish --locked
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      with:
        maturin-version: v1.16.0
        command: sdist
        args: --out dist
        rust-toolchain: stable
    - name: List files
      run: find dist/ -type f -print0 -quit | xargs -0 tar ztf
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package_sdist
        path: dist
  build-pyo3:
    strategy:
      fail-fast: false
      matrix:
        include:
        # manylinux
        - os: linux
          target: x86_64
          manylinux: auto
        - os: linux
          target: aarch64
          manylinux: auto
        - os: linux
          target: i686
          manylinux: "2014"
          maturin-args: --zig
        # musllinux
        - os: linux
          target: x86_64
          manylinux: musllinux_1_2
        - os: linux
          target: aarch64
          manylinux: musllinux_1_2
        # macos
        - os: macos
          target: x86_64
        - os: macos
          target: aarch64
        # windows
        - os: windows
          target: x86_64
        - os: windows
          target: i686
          python-architecture: x86
        - os: windows
          runner: windows-11-arm
          target: aarch64
          python-architecture: arm64
    runs-on: ${{ matrix.runner || format('{0}-latest', (matrix.os == 'linux' && 'ubuntu') || matrix.os) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"
        architecture: ${{ matrix.python-architecture || 'x64' }}
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - name: Build
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      with:
        maturin-version: v1.16.0
        target: ${{ matrix.target }}
        manylinux: ${{ matrix.manylinux }}
        args: --release --locked --out dist --compatibility pypi ${{ matrix.maturin-args }}
        rust-toolchain: stable
        docker-options: -e CI
    - name: List wheels
      run: ${{ (matrix.os == 'windows' && 'dir') || 'ls -lh' }} dist/
    - name: Check with Twine
      run: uvx twine check --strict dist/*
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package_${{ matrix.os }}_${{ matrix.target }}_${{ matrix.manylinux || 'native' }}
        path: dist
  testpypi:
    environment:
      name: testpypi
      url: https://test.pypi.org/p/evalica
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs:
    - build-sdist
    - build-pyo3
    steps:
    - name: Download packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: package_*
        merge-multiple: true
        path: dist
    - run: ls -lh dist/
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
  pypi:
    if: github.event_name == 'release'
    concurrency:
      group: pypi
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/evalica
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs: testpypi
    steps:
    - name: Download packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: package_*
        merge-multiple: true
        path: dist
    - run: ls -lh dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

name: Tests

on:
  push:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  BINSTALL_DISABLE_TELEMETRY: true
  CARGO_TERM_COLOR: always
  DO_NOT_TRACK: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PLOTLY_RENDERER: notebook

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Check formatting
      run: cargo fmt --check
    - name: Build
      run: cargo build --locked --verbose
    - name: Run clippy
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Run tests
      run: cargo test --locked --verbose
    - name: Generate docs
      run: cargo doc --locked --verbose --no-deps
  wasm:
    runs-on: ubuntu-latest
    needs: rust
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
    - name: Install Wasm target
      run: rustup target add wasm32-unknown-unknown
    - name: Check Wasm
      run: cargo check --locked --target wasm32-unknown-unknown --features wasm
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
      with:
        version: 1.27.0
    - name: Install wasm-bindgen-cli
      run: |
        WASM_BINDGEN_VERSION=$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
        cargo binstall -y --force "wasm-bindgen-cli@$WASM_BINDGEN_VERSION"
    - name: Run Wasm tests
      run: cargo test --locked --target wasm32-unknown-unknown --features wasm
      env:
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    - name: Build Wasm package
      run: |
        cargo build --locked --target wasm32-unknown-unknown --features wasm --release
        wasm-bindgen target/wasm32-unknown-unknown/release/evalica.wasm --out-dir pkg --target web
        ls -lh pkg/
    - name: Prepare artifact
      run: |
        mkdir examples/wasm/pkg
        cp pkg/* examples/wasm/pkg/
    - name: Upload Wasm
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wasm-example
        path: examples/wasm
        if-no-files-found: error
        retention-days: 5
  python:
    runs-on: ubuntu-latest
    needs: rust
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14", "3.15" ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        activate-environment: true
        cache-dependency-glob: |
          **/Cargo.toml
          **/pyproject.toml
    - name: Set up pandoc
      uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1
    - name: Set up Maturin
      run: |
        uv venv --allow-existing
        uv pip install maturin
        maturin develop --uv --locked --extras dev,docs,gradio
    - name: Restore Hypothesis database
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .hypothesis/
        key: hypothesis-${{ runner.os }}-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: hypothesis-${{ runner.os }}-${{ matrix.python-version }}-
    - name: Lint with Mypy
      run: mypy .
    - name: Lint with ty
      continue-on-error: true
      run: ty check
    - name: Lint with Ruff
      run: |
        ruff check
        ruff format --check
    - if: matrix.python-version == '3.15'
      name: Run tests with coverage
      run: pytest --cov --junitxml=junit.xml -o junit_family=legacy
    - if: matrix.python-version != '3.15'
      name: Run tests only
      run: pytest
    - if: matrix.python-version == '3.15'
      name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        use_oidc: true
    - if: matrix.python-version == '3.15' && !cancelled()
      name: Upload test results to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        report_type: test_results
        use_oidc: true
    - name: Run Module
      run: |
        python3 -m evalica.gradio --version
        python3 -m evalica --input=food.csv pairwise counting
        python3 -m evalica --input=codings.csv alpha
    - name: Run CLI
      run: |
        evalica --input=food.csv pairwise counting
        evalica --input=codings.csv alpha --distance=ordinal
    - name: Lint Jupyter with Mypy
      run: nbqa mypy *.ipynb docs/*.ipynb
    - name: Lint with abi3audit
      run: python3 -c "import evalica;print(evalica._brzo.__file__)" | xargs abi3audit --assume-minimum-abi3=3.10 --verbose
    - name: Run Jupyter
      run: |
        mkdir jupyter
        jupyter trust docs/tutorial.ipynb
        jupyter nbconvert --to html --output index.html --execute docs/tutorial.ipynb
        mv docs/index.html jupyter/
        cp Evalica.svg jupyter/
    - if: matrix.python-version == '3.15'
      name: Upload Jupyter
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: jupyter
        path: jupyter
        if-no-files-found: error
        retention-days: 5
    - name: Run Sphinx
      run: sphinx-build -W --keep-going -b html docs/ site/
    - if: matrix.python-version == '3.15'
      name: Make a release build
      run: maturin develop --uv --locked --release --extras dev,docs
    - if: matrix.python-version == '3.15'
      name: Run benchmarks
      uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
      with:
        run: pytest --codspeed
        mode: simulation
    - name: Run tests (naïve)
      run: find python/evalica -name "*.so" -delete -o -name "*.pyd" -delete && pytest
    - if: always()
      name: Save Hypothesis database
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .hypothesis/
        key: hypothesis-${{ runner.os }}-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
  meta:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: false
    - name: Validate CITATION.cff
      run: uvx cffconvert --validate
    - name: Validate versions
      run: python3 scripts/version.py

[package]
name = "evalica"
version = "0.4.3"
edition = "2024"
rust-version = "1.85"
description = "Evalica, your favourite evaluation toolkit."
repository = "https://github.com/dustalov/evalica"
license = "Apache-2.0"
keywords = ["ranking", "evaluation", "bradley-terry", "elo", "leaderboard"]
categories = ["algorithms", "mathematics", "science"]
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[lib]
name = "evalica"
crate-type = ["cdylib"]

[dependencies]
ndarray = { version = "^0.17.2", default-features = false }
num-traits = "^0.2.19"
rand = "^0.10.0"
pyo3 = { version = "^0.30.1", features = ["abi3-py310"], optional = true }
numpy = { version = "^0.30.0", optional = true }
wasm-bindgen = { version = "^0.2.108", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.1", features = ["wasm_js"] }

[features]
python = ["dep:pyo3", "dep:numpy"]
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
approx = "^0.5.1"
wasm-bindgen-test = "^0.3.58"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"
unreadable_literal = "allow"
explicit_iter_loop = "allow"
cast_precision_loss = "allow"
multiple_crate_versions = "allow"
